<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareCircle on Alexa+ (simulator)</title>
<style>
  :root { --bg:#0b0f14; --panel:#121820; --ink:#eef2f6; --muted:#8b97a6; --line:#1f2833;
          --ring:#16c2f3; --ok:#43c58a; --warn:#f0a73b; --bad:#f2714a; --card:#18202a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { display:grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap:18px; padding:18px; max-width:1400px; margin:auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  /* the "device" */
  .device { background:#05070a; border-radius:28px; padding:16px; box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px #1b222c; }
  .screen { background:radial-gradient(1200px 500px at 20% 0%, #13283b 0%, #0b1118 55%); border-radius:16px; min-height:560px;
            padding:22px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .topbar { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
  .clock { font-size:44px; font-weight:300; letter-spacing:-.02em; color:var(--ink); }
  .ring { position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--ring); opacity:0; transition:opacity .3s; }
  .ring.listening { opacity:1; animation: pulse 1s infinite; }
  .ring.thinking { opacity:1; background:linear-gradient(90deg, transparent, var(--ring), transparent); background-size:200% 100%; animation: sweep 1s linear infinite; }
  @keyframes pulse { 50% { opacity:.4 } }
  @keyframes sweep { from { background-position:200% 0 } to { background-position:-200% 0 } }
  .convo { margin-top:16px; flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:520px; }
  .you { align-self:flex-end; color:var(--muted); font-style:italic; max-width:85%; text-align:right; }
  .alexa { font-size:22px; line-height:1.35; max-width:95%; }
  .cardx { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; animation: up .35s ease; }
  @keyframes up { from { transform:translateY(8px); opacity:0 } }
  .cardx h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); gap:10px; }
  .row:first-of-type { border-top:0; }
  .pill { font-size:12px; padding:2px 9px; border-radius:99px; font-weight:600; white-space:nowrap; }
  .taken { background:#1b3a2c; color:var(--ok); } .pending { background:#16304a; color:#7fc1ff; }
  .missed, .skipped { background:#43211a; color:var(--bad); }
  .alertbox { border-left:4px solid var(--bad); background:#2a1712; padding:10px 12px; border-radius:10px; margin-top:8px; }
  .big { font-size:36px; font-weight:700; }
  .bars { display:flex; gap:5px; align-items:flex-end; height:56px; margin-top:6px; }
  .bars div { flex:1; background:var(--ring); border-radius:3px 3px 0 0; min-height:3px; }
  iframe.dash { width:100%; height:380px; border:0; border-radius:10px; background:#fff; }
  .controls { display:flex; gap:10px; margin-top:14px; }
  .mic { width:56px; height:56px; border-radius:50%; border:0; background:var(--ring); color:#001018; font-size:24px; cursor:pointer; flex:none; }
  .mic.on { background:var(--bad); }
  input { flex:1; background:#0f151c; border:1px solid var(--line); color:var(--ink); border-radius:28px; padding:0 18px; font-size:16px; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { background:#141c25; border:1px solid var(--line); color:var(--ink); border-radius:99px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .chip:hover { border-color:var(--ring); }
  /* under the hood */
  .hood { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; min-height:560px; }
  .hood h2 { margin:0; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .meta { font-size:12px; color:var(--muted); margin:6px 0 10px; }
  .meta b { color:var(--ink); font-weight:600; }
  .log { flex:1; overflow-y:auto; font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:640px; }
  .call { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; background:#0e141b; animation: up .3s ease; }
  .call .name { color:var(--ring); font-weight:700; }
  .call .ms { float:right; color:var(--muted); }
  .call pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-word; color:#c6d0db; max-height:180px; overflow:auto; }
  .call .args { color:#f3c77b; }
  a { color:var(--ring); }
</style>
</head>
<body>
<div class="wrap">
  <div class="device">
    <div class="screen">
      <div class="topbar"><span>Alexa+ · CareCircle</span><span id="who">Margaret's kitchen</span></div>
      <div class="clock" id="clock">--:--</div>
      <div class="convo" id="convo">
        <div class="alexa">Good to see you, Margaret. Try “Alexa, what's next today?”</div>
      </div>
      <div class="ring" id="ring"></div>
    </div>
    <div class="controls">
      <button class="mic" id="mic" title="Hold to talk (or press space)">🎙</button>
      <input id="text" placeholder="Say or type something to Alexa…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <aside class="hood">
    <h2>Under the hood · MCP</h2>
    <div class="meta" id="meta">connecting…</div>
    <div class="log" id="log"><div class="meta">Every action Alexa+ takes appears here as an MCP <b>tools/call</b> over Streamable HTTP.</div></div>
  </aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t12 = hhmm => { const [h,m] = hhmm.split(":").map(Number); return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`; };
const session = Math.random().toString(36).slice(2);
let info = {};

setInterval(() => $("clock").textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}), 1000);

const DEMO = ["What's next today?", "I just took my Metformin and Lisinopril",
  "I'm feeling a bit dizzy this morning and only slept 4 hours", "Show me the dashboard",
  "How's Mom been this week?", "Let Priya know I'd love a call tonight"];
$("chips").innerHTML = DEMO.map(d => `<button class="chip">${esc(d)}</button>`).join("");
$("chips").onclick = e => { if (e.target.classList.contains("chip")) ask(e.target.textContent); };

fetch("/api/info").then(r => r.json()).then(i => {
  info = i;
  $("meta").innerHTML = `server <b>${esc(i.mcp_url)}</b> · brain <b id="brain">${esc(i.brain)}</b> · <a href="${esc(i.dashboard_url)}" target="_blank">family dashboard ↗</a>`;
});

function card(c) {
  if (c.type === "schedule" || c.type === "agenda") {
    const doses = (c.doses || []).map(d => `<div class="row"><span><b>${esc(d.medication)}</b> ${esc(d.dose)} · ${t12(d.time)}</span><span class="pill ${d.status}">${d.status}</span></div>`).join("");
    const appts = (c.appointments || []).map(a => `<div class="row"><span>📅 ${esc(a.title)}</span><span>${new Date(a.at).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"})}</span></div>`).join("");
    return `<div class="cardx"><h3>${esc(c.title)}</h3>${doses}${appts}</div>`;
  }
  if (c.type === "checkin") {
    return `<div class="cardx"><h3>${esc(c.title)}</h3>
      <div class="row"><span>Mood</span><span>${"●".repeat(c.mood)}${"○".repeat(5-c.mood)}</span></div>
      ${c.sleep_hours != null ? `<div class="row"><span>Sleep</span><span>${c.sleep_hours} h</span></div>` : ""}
      ${c.pain != null ? `<div class="row"><span>Pain</span><span>${c.pain}/10</span></div>` : ""}
      ${(c.alerts||[]).map(a => `<div class="alertbox">🔔 Family alerted · ${esc(a)}</div>`).join("")}</div>`;
  }
  if (c.type === "summary") {
    return `<div class="cardx"><h3>${esc(c.title)}</h3><div class="big">${c.adherence_pct}% <span style="font-size:15px;font-weight:400;color:var(--muted)">doses taken</span></div>
      <div class="bars">${c.per_day.map(d => `<div style="height:${d.due?100*d.taken/d.due:0}%"></div>`).join("")}</div>
      ${c.average_mood ? `<div class="row"><span>Average mood</span><span>${c.average_mood} / 5</span></div>` : ""}
      ${(c.alerts||[]).map(a => `<div class="alertbox">${esc(a.reason)}</div>`).join("")}</div>`;
  }
  if (c.type === "alert") {
    return `<div class="cardx"><h3>${esc(c.title)}</h3><div class="alertbox">📨 To ${esc((c.recipients||[]).join(", "))}: ${esc(c.reason)}</div></div>`;
  }
  if (c.type === "dashboard") {
    return `<div class="cardx"><h3>MCP App · ui://carecircle/dashboard.html</h3><iframe class="dash" src="${esc(info.dashboard_url)}?person=${encodeURIComponent(c.person)}"></iframe></div>`;
  }
  return "";
}

function say(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1.02;
    const v = speechSynthesis.getVoices().find(v => /Samantha|Google US English|Aria|Jenny/i.test(v.name)); if (v) u.voice = v;
    speechSynthesis.speak(u); } catch {}
}

async function ask(text) {
  text = text.trim(); if (!text) return;
  $("text").value = "";
  const convo = $("convo");
  convo.insertAdjacentHTML("beforeend", `<div class="you">“${esc(text)}”</div>`);
  $("ring").className = "ring thinking";
  convo.scrollTop = convo.scrollHeight;
  const r = await fetch("/api/ask", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({text, session})}).then(r => r.json());
  $("ring").className = "ring";
  convo.insertAdjacentHTML("beforeend", `<div class="alexa">${esc(r.speech)}</div>` + (r.cards||[]).map(card).join(""));
  convo.scrollTop = convo.scrollHeight;
  if ($("brain")) $("brain").textContent = r.brain;
  const log = $("log");
  for (const c of r.calls || []) {
    log.insertAdjacentHTML("afterbegin", `<div class="call"><span class="name">tools/call → ${esc(c.tool)}</span><span class="ms">${c.ms} ms</span>
      <pre class="args">${esc(JSON.stringify(c.arguments))}</pre><pre>${esc(JSON.stringify(c.result, null, 1)).slice(0, 1400)}</pre></div>`);
  }
  say(r.speech);
}

$("text").addEventListener("keydown", e => { if (e.key === "Enter") ask(e.target.value); });

// Voice in: Web Speech API (Chrome / Edge / Safari)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true;
  rec.onresult = e => { const r = e.results[e.results.length-1]; $("text").value = r[0].transcript.replace(/^alexa,?\s*/i, ""); if (r.isFinal) ask($("text").value); };
  rec.onend = () => { $("mic").classList.remove("on"); if ($("ring").className.includes("listening")) $("ring").className = "ring"; };
}
$("mic").onclick = () => {
  if (!rec) { $("text").focus(); return; }
  speechSynthesis.cancel(); $("mic").classList.add("on"); $("ring").className = "ring listening"; rec.start();
};
document.addEventListener("keydown", e => { if (e.code === "Space" && document.activeElement !== $("text")) { e.preventDefault(); $("mic").click(); } });
</script>
</body>
</html>
